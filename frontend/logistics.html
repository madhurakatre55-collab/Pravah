<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logistics & Deliveries — PRAVAH NER Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="view" id="view-shell">
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand-mark" id="brandSidebar"></div>
      </div>
      <div class="nav-group" id="navGroup"></div>
      <button class="sidebar-toggle" onclick="toggleSidebar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        <span class="sidebar-foot-text" id="sidebarToggleLabel">Collapse</span>
      </button>
      <div class="sidebar-foot sidebar-foot-text">PRAVAH v0.9 · Prototype build<br>Demo data only</div>
    </aside>

    <div class="main-col">
      <header class="navbar">
        <button class="icon-btn mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="Search routes, vehicles, districts…">
        </div>
        <div class="navbar-right">
          <span class="status-chip online" id="netStatus">🟢 Online</span>
          <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
            <option value="en">EN — English</option>
            <option value="hi">HI — हिन्दी</option>
          </select>
          <button class="icon-btn" onclick="go('app/notifications')" aria-label="Notifications">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="badge-dot"></span>
          </button>
          <div class="user-chip">
            <div class="avatar" id="userAvatar">DU</div>
            <span style="font-size:.82rem;font-weight:600;" id="userName">Demo User</span>
          </div>
          <button class="icon-btn" onclick="handleLogout()" title="Log out" aria-label="Log out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </header>
      <main class="page" id="pageContent"></main>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
